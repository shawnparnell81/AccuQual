# Same headers as the accuqual-web service in render.yaml.
# Included from each static location: nginx does not inherit add_header
# into a location that sets its own.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-Mb8nRt4eJoWkEa9+rx0AHFcN7UHuTXQFx4RV3IKaA2w=' 'sha256-gOPqD7kbTibYMF8kfSv868xSKoUFbw3JAhoDICyd9jQ=' 'sha256-pd3az8vlUoOOd+jEAgDTzXUM40m7ZRE73qy1OBqoKnA=' 'sha256-LZnduxEtDXK/WwHP7D/pvwhUsHaipbL8eg5tlI41tUE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'" always;
