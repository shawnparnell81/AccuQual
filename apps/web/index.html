<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/branding/logo-mark.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#0B1220" />
    <title>AccuQual</title>
    <script>
      (function () {
        // Marketing hosts show the static landing page and never boot the app
        // (no session refresh). Keep this host list in sync with src/lib/publicSite.ts.
        var host = (location.hostname || "").toLowerCase().replace(/\.$/, "");
        if (host !== "www.accuqualqms.com" && host !== "accuqualqms.com") return;
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
          });
        }
        var path = location.pathname;
        if (path === "/login" || path === "/forgot-password" || path === "/reset-password") {
          location.replace("https://app.accuqualqms.com" + path + location.search + location.hash);
          return;
        }
        if (path === "/welcome" || path.indexOf("/welcome/") === 0) return;
        location.replace("/welcome/index.html");
      })();
    </script>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("accuqual-theme-mode");
          var scheme = localStorage.getItem("accuqual-color-scheme");
          document.documentElement.setAttribute("data-theme", mode === "light" || mode === "dark" ? mode : "dark");
          document.documentElement.setAttribute("data-scheme", scheme === "dma" ? "dma" : "classic");
          if (scheme === "dma") return;
          var raw = localStorage.getItem("accuqual-theme-vars");
          if (!raw) return;
          var vars = JSON.parse(raw);
          var triplet = /^(\d{1,3}) (\d{1,3})% (\d{1,3})%$/;
          var allowed = {
            "--background": 1,
            "--foreground": 1,
            "--card": 1,
            "--muted": 1,
            "--muted-foreground": 1,
            "--border": 1,
            "--primary": 1,
            "--primary-foreground": 1,
            "--secondary": 1,
            "--secondary-foreground": 1,
            "--accent": 1,
            "--accent-foreground": 1,
            "--form-field": 1,
            "--button": 1,
            "--button-foreground": 1,
            "--ring": 1,
            "--brand-header": 1,
            "--brand-glow": 1,
          };
          for (var key in vars) {
            if (!Object.prototype.hasOwnProperty.call(allowed, key) || typeof vars[key] !== "string") continue;
            var match = triplet.exec(vars[key]);
            if (!match || +match[1] > 360 || +match[2] > 100 || +match[3] > 100) continue;
            document.documentElement.style.setProperty(key, vars[key]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
