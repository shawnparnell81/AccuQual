# Private single-company deploy on the free Hobby workspace. About $7.25/month:
#   Hobby workspace $0, accuqual-web static site $0, accuqual-api starter $7,
#   1 GB disk $0.25.
# Redis and the three background workers are not provisioned from this file.
# Their definitions are kept in render.workers.yaml so they can be added back later.
services:
  - type: web
    name: accuqual-api
    # Deploy only after the GitHub checks (build, tests, security scan) pass - never straight from an unchecked commit.
    autoDeployTrigger: checksPass
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    # starter is $7/month. A persistent disk is not available on the free
    # instance type, and a service with a disk cannot scale past one instance.
    # The 1 GB disk is $0.25/month.
    plan: starter
    # Must stay /health. The handler returns within a few seconds even when
    # REDIS_URL is unset; a hung probe here fails the deploy.
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    # Hobby includes this custom domain (the other is app.accuqualqms.com on
    # the static site). The rewrite in accuqual-web sends /api/* here.
    domains:
      - api.accuqualqms.com
    # Valid because `domains` above is non-empty. Requests to this service's
    # onrender.com hostname then receive a 404. Render's own health check is
    # not that public hostname, so healthCheckPath keeps working.
    renderSubdomainPolicy: disabled
    envVars:
      - key: NODE_ENV
        value: production
      # Use the Session Pooler string (IPv4), never Direct connection —
      # Render's network doesn't route the IPv6 address Supabase's direct
      # endpoint resolves to. See DEPLOY.md's "The one gotcha" section.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # 64 hex chars (32 bytes) — generate once with `openssl rand -hex 32`.
      # Never rotate it: company AI provider keys already stored were
      # encrypted with this value and cannot be decrypted with a new one.
      # The boot guard in config/env.ts refuses to start in production on
      # the schema default, so this MUST be a real value.
      - key: AI_CONFIG_ENCRYPTION_KEY
        sync: false
      # Paste https://app.accuqualqms.com (no trailing slash).
      - key: ALLOWED_ORIGINS
        sync: false
      # Paste https://app.accuqualqms.com (no trailing slash). Password-reset
      # and welcome emails build their links from this.
      - key: FRONTEND_URL
        sync: false
      # The disk above is mounted at /var/data. Only this directory survives
      # a redeploy; the rest of the container filesystem does not.
      - key: STORAGE_LOCAL_PATH
        value: /var/data/uploads
      # This blueprint does not run the workers. Empty means the monitor
      # does not alert that workflow, ai, or digital-twin stopped reporting.
      - key: MONITOR_EXPECTED_WORKERS
        value: ""
      # Optional — real deployment alerting. Leave blank to skip; the app
      # still logs a real DB outage loudly either way. See DEPLOY.md's
      # "Monitoring & alerting" section for how to get a Slack Incoming
      # Webhook URL to paste in here.
      - key: ALERT_WEBHOOK_URL
        sync: false
      # Monitoring (see DEPLOY.md "Monitoring & alerting"). Each is optional and does nothing until set.
      # SENTRY_DSN: error tracking for the API. HEARTBEAT_URL: dead-man's-switch ping (Healthchecks.io etc.).
      - key: SENTRY_DSN
        sync: false
      - key: HEARTBEAT_URL
        sync: false
      # ZeptoMail (agent qms_transactional) Send Mail token — the preferred
      # delivery path; takes precedence over SMTP_* below. Paste it in
      # Render's dashboard, never into this repo.
      - key: ZEPTOMAIL_SEND_TOKEN
        sync: false
      - key: CONTACT_INBOX_EMAIL
        sync: false
      # Real SMTP delivery (onboarding/notification email) — all optional;
      # leave blank to keep every send in the honest log-only stub mode
      # notification.service.ts already falls back to. Verified working
      # locally against a real Zoho Mail business account (smtppro.zoho.com,
      # port 465/SSL) — same four values go here for production.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Optional Cloudflare Access JWT check. Leave BOTH blank to disable it
      # (local and docker-compose). When both are set, every route except
      # /health and /health/live requires the Access JWT issued for the app
      # at app.accuqualqms.com. Do not put Access on api.accuqualqms.com.
      # Team domain example: your-team.cloudflareaccess.com
      # AUD: the Application Audience tag on that Access application.
      - key: CF_ACCESS_TEAM_DOMAIN
        sync: false
      - key: CF_ACCESS_AUD
        sync: false

  - type: web
    name: accuqual-web
    # Deploy only after the GitHub checks (build, tests, security scan) pass - never straight from an unchecked commit.
    autoDeployTrigger: checksPass
    # Hobby static sites are free. There is no instance plan to set.
    # apps/web/Dockerfile and nginx.conf.template stay in the repo for
    # docker-compose and local use; Render does not build them.
    runtime: static
    buildCommand: npm ci && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    domains:
      - app.accuqualqms.com
    # Valid here because `domains` above is non-empty. Requests to this
    # service's onrender.com hostname then receive a 404.
    renderSubdomainPolicy: disabled
    envVars:
      # Baked into the Vite build. The browser calls this same origin;
      # the /api/* rewrite below forwards to the API.
      - key: VITE_API_BASE_URL
        value: /api
      # Match CI (Node 20). Render's static build uses this.
      - key: NODE_VERSION
        value: "20"
      # Optional browser error tracking (Sentry DSN for the web project). Baked into the build, so changing it needs a redeploy.
      - key: VITE_SENTRY_DSN
        sync: false
    # First matching route wins. Existing files are served before these rules,
    # which is why the SPA fallback does not hide hashed assets.
    # The API destination is a full URL, not an env var — keep it equal to
    # the accuqual-api custom domain. /api/health becomes
    # https://api.accuqualqms.com/health (the * is the captured suffix).
    routes:
      - type: rewrite
        source: /api/*
        destination: https://api.accuqualqms.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /index.html
        name: Cache-Control
        value: no-cache
