services:
  - type: web
    name: accuqual-api
    # Deploy only after the GitHub checks (build, tests, security scan) pass - never straight from an unchecked commit.
    autoDeployTrigger: checksPass
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Use the Session Pooler string (IPv4), never Direct connection —
      # Render's network doesn't route the IPv6 address Supabase's direct
      # endpoint resolves to. See DEPLOY.md's "The one gotcha" section.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # 64 hex chars (32 bytes) — generate with `openssl rand -hex 32`.
      # The boot guard in config/env.ts refuses to start in production on
      # the schema default, so this MUST be set to a real value here.
      - key: AI_CONFIG_ENCRYPTION_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: accuqual-web
          property: hostport
      - key: FRONTEND_URL
        fromService:
          type: web
          name: accuqual-web
          property: hostport
      # Optional — real deployment alerting. Leave blank to skip; the app
      # still logs a real DB outage loudly either way. See DEPLOY.md's
      # "Monitoring & alerting" section for how to get a Slack Incoming
      # Webhook URL to paste in here.
      - key: ALERT_WEBHOOK_URL
        sync: false
      # Monitoring (see DEPLOY.md "Monitoring & alerting"). Each is optional and does nothing until set.
      # SENTRY_DSN: error tracking for the API. HEARTBEAT_URL: dead-man's-switch ping (Healthchecks.io etc.).
      - key: SENTRY_DSN
        sync: false
      - key: HEARTBEAT_URL
        sync: false
      # Watch these background workers; the alert names any that stop reporting in. Remove a name if you don't deploy that worker.
      - key: MONITOR_EXPECTED_WORKERS
        value: workflow,ai,digital-twin
      # ZeptoMail (agent qms_transactional) Send Mail token — the preferred
      # delivery path; takes precedence over SMTP_* below. Paste it in
      # Render's dashboard, never into this repo.
      - key: ZEPTOMAIL_SEND_TOKEN
        sync: false
      # Stripe billing (docs/billing-setup.md) — paste values in Render's
      # dashboard, never into this repo. Unset = billing shows "not set up".
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FOUNDATION
        sync: false
      - key: STRIPE_PRICE_OPERATIONS
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: CONTACT_INBOX_EMAIL
        sync: false
      # Real SMTP delivery (onboarding/notification email) — all optional;
      # leave blank to keep every send in the honest log-only stub mode
      # notification.service.ts already falls back to. Verified working
      # locally against a real Zoho Mail business account (smtppro.zoho.com,
      # port 465/SSL) — same four values go here for production.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: accuqual-web
    # Deploy only after the GitHub checks (build, tests, security scan) pass - never straight from an unchecked commit.
    autoDeployTrigger: checksPass
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      # Render passes service-level envVars as Docker build args when the
      # Dockerfile declares a matching ARG (see apps/web/Dockerfile's own
      # `ARG VITE_API_BASE_URL`) — this should resolve to accuqual-api's
      # real public URL automatically. Verify this once deployed; if it
      # doesn't come through as an absolute URL, set it manually to
      # accuqual-api's Render URL and trigger a manual redeploy of this
      # service — see DEPLOY.md.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: accuqual-api
          property: hostport
      # Optional browser error tracking (Sentry DSN for the web project). Baked into the build, so changing it needs a redeploy.
      - key: VITE_SENTRY_DSN
        sync: false

  # Real Redis Streams event bus — previously undeployed entirely (this
  # blueprint only ever had accuqual-api/accuqual-web), meaning the three
  # workers below had nothing to consume from in production even though
  # they're fully built and tested. A PAID, metered Render resource, unlike
  # the two web services above — Render will show you its real plan/pricing
  # before provisioning anything; nothing here spends money by itself.
  # `ipAllowList: []` keeps it unreachable from the public internet — only
  # other services in this same Render account/region (the workers, and
  # accuqual-api if it ever needs it) can reach it. This whole service
  # block, and the `connectionString` property referenced below, are a
  # best-effort blueprint addition — same "not yet verified against a real
  # Render account" caveat DEPLOY.md already gives the accuqual-web
  # `fromService` wiring; confirm the exact field names against Render's
  # own current docs/dashboard before relying on this.
  - type: redis
    name: accuqual-redis
    ipAllowList: []
    plan: starter

  - type: worker
    name: accuqual-workflow-worker
    # Deploy only after the GitHub checks (build, tests, security scan) pass - never straight from an unchecked commit.
    autoDeployTrigger: checksPass
    runtime: docker
    dockerfilePath: ./workers/workflow-worker/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      # Paste the EXACT SAME value you gave accuqual-api — same real
      # Supabase Session Pooler string, same database. Render has no
      # built-in way to share one service's `sync: false` value with
      # another, so this has to be entered manually in both places.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: accuqual-redis
          property: connectionString
      # Never actually verified by this worker (it has no HTTP endpoint to
      # authenticate requests against) — only required because this process
      # transitively imports config/env.ts, which validates the full env
      # schema at startup regardless of which fields a given process
      # actually uses. A fresh random value per service is fine.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Same real value as accuqual-api's, not a fresh one — this worker's
      # ai_suggestion action handler decrypts company BYOK keys that were
      # encrypted under accuqual-api's key; a different value here would
      # make every decryption fail, not just be redundant.
      - key: AI_CONFIG_ENCRYPTION_KEY
        sync: false
      # ZeptoMail (agent qms_transactional) Send Mail token — the preferred
      # delivery path; takes precedence over SMTP_* below. Same value as
      # accuqual-api's.
      - key: ZEPTOMAIL_SEND_TOKEN
        sync: false
      # Optional — only used if a workflow definition's send_email action
      # fires. Same values as accuqual-api's SMTP_* — leave blank to keep
      # those sends in log-only stub mode instead.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # Optional — the platform-wide fallback key an ai_suggestion action
      # uses when the triggering company has no BYOK key of its own
      # configured. Same values as accuqual-api's, if set there.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: accuqual-ai-worker
    # Deploy only after the GitHub checks (build, tests, security scan) pass - never straight from an unchecked commit.
    autoDeployTrigger: checksPass
    runtime: docker
    dockerfilePath: ./workers/ai-worker/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: accuqual-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_CONFIG_ENCRYPTION_KEY
        sync: false
      # embedding-engine.ts always calls OpenAI's embeddings API
      # specifically, regardless of a company's own LLM_PROVIDER choice —
      # unset means this worker logs a warning and falls back to a
      # deterministic pseudo-embedding (fine for dev, not real semantic
      # search in production).
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: accuqual-digital-twin-worker
    # Deploy only after the GitHub checks (build, tests, security scan) pass - never straight from an unchecked commit.
    autoDeployTrigger: checksPass
    runtime: docker
    dockerfilePath: ./workers/digital-twin-worker/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: accuqual-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AI_CONFIG_ENCRYPTION_KEY
        sync: false
