apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: accuqual-ingress
  namespace: accuqual
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - app.accuqual.example.com
      secretName: accuqual-tls
  rules:
    - host: app.accuqual.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: accuqual-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: accuqual-web
                port:
                  number: 80
