apiVersion: apps/v1
kind: Deployment
metadata:
  name: accuqual-api
  namespace: accuqual
  labels:
    app: accuqual-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: accuqual-api
  template:
    metadata:
      labels:
        app: accuqual-api
    spec:
      containers:
        - name: api
          image: <ACR_URL>/accuqual-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: accuqual-config
            - secretRef:
                name: accuqual-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: accuqual-api-hpa
  namespace: accuqual
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: accuqual-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
