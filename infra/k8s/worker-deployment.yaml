# The three background workers (see /workers). Each is a single-replica
# Deployment consuming its own Redis Stream — see workers/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accuqual-worker
  namespace: accuqual
  labels:
    app: accuqual-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accuqual-worker
  template:
    metadata:
      labels:
        app: accuqual-worker
    spec:
      containers:
        - name: workflow-worker
          image: <ACR_URL>/accuqual-workflow-worker:latest
          envFrom:
            - configMapRef:
                name: accuqual-config
            - secretRef:
                name: accuqual-secrets
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accuqual-ai-worker
  namespace: accuqual
  labels:
    app: accuqual-ai-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accuqual-ai-worker
  template:
    metadata:
      labels:
        app: accuqual-ai-worker
    spec:
      containers:
        - name: ai-worker
          image: <ACR_URL>/accuqual-ai-worker:latest
          envFrom:
            - configMapRef:
                name: accuqual-config
            - secretRef:
                name: accuqual-secrets
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accuqual-digital-twin-worker
  namespace: accuqual
  labels:
    app: accuqual-digital-twin-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accuqual-digital-twin-worker
  template:
    metadata:
      labels:
        app: accuqual-digital-twin-worker
    spec:
      containers:
        - name: digital-twin-worker
          image: <ACR_URL>/accuqual-digital-twin-worker:latest
          envFrom:
            - configMapRef:
                name: accuqual-config
            - secretRef:
                name: accuqual-secrets
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
