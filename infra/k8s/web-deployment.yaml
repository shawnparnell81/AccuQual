apiVersion: apps/v1
kind: Deployment
metadata:
  name: accuqual-web
  namespace: accuqual
  labels:
    app: accuqual-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accuqual-web
  template:
    metadata:
      labels:
        app: accuqual-web
    spec:
      containers:
        - name: web
          image: <ACR_URL>/accuqual-web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
