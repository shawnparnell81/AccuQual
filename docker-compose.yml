services:
  postgres:
    # pgvector/pgvector (not the plain postgres image) — bundles the pgvector
    # extension the ai_embeddings table needs; CREATE EXTENSION would fail
    # against a plain postgres image (see db/migrate.ts).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: accuqual
      POSTGRES_PASSWORD: accuqual
      POSTGRES_DB: accuqual
    ports:
      # Host-side 5433, not 5432 — this machine already has a native
      # PostgreSQL service bound to 5432. Match this in DATABASE_URL.
      - "5433:5432"
    volumes:
      - accuqual_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    # .env's DATABASE_URL now points at a real external host (Supabase) —
    # that resolves fine from inside this container as-is, no override
    # needed. REDIS_URL still needs one: .env's own value points at
    # `localhost` for running `npm run dev` directly on the host, but inside
    # this container "localhost" is the container itself, not the redis
    # service — Redis stays local to this compose network regardless of
    # where Postgres lives.
    environment:
      REDIS_URL: redis://redis:6379
      # This stack runs all three workers, so the monitor should notice if one stops reporting in.
      MONITOR_EXPECTED_WORKERS: workflow,ai,digital-twin
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    volumes:
      # STORAGE_LOCAL_PATH defaults to ./uploads, resolved from the runtime
      # image's WORKDIR (/app) — user-uploaded document-folder PDF templates
      # (and seeded form templates) live here. Without this volume, every
      # `docker compose build api` throws away anything a user has uploaded.
      - accuqual_uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Optional browser error tracking DSN from .env; empty = Sentry code is never loaded.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    depends_on:
      - api
    ports:
      - "5183:80" # host port matches apps/web/vite.config.ts's dev port for consistency

  workflow-worker:
    build:
      context: .
      dockerfile: workers/workflow-worker/Dockerfile
    env_file: .env
    # See api's own comment above — DATABASE_URL needs no override (real
    # external host), REDIS_URL still does (Redis stays on this network).
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - postgres

  ai-worker:
    build:
      context: .
      dockerfile: workers/ai-worker/Dockerfile
    env_file: .env
    # See api's own comment above — DATABASE_URL needs no override (real
    # external host), REDIS_URL still does (Redis stays on this network).
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - postgres

  digital-twin-worker:
    build:
      context: .
      dockerfile: workers/digital-twin-worker/Dockerfile
    env_file: .env
    # See api's own comment above — DATABASE_URL needs no override (real
    # external host), REDIS_URL still does (Redis stays on this network).
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - postgres

volumes:
  accuqual_pg_data:
  accuqual_uploads:
