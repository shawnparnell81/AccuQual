title = "AccuQual secret scanning"

[extend]
useDefault = true

# Throwaway passwords the integration tests use against disposable test databases (never a real credential).
# Attached to the generic-api-key rule, and only when BOTH the path and the exact string match.
# A top-level [allowlist] cannot do that: its regexes ignore the path and would hide the same string
# anywhere in the repo. [[allowlists]] at the top level is not read at all.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Fixture passwords in integration tests"
condition = "AND"
paths = ['''(^|/)services/api/test/''']
regexes = ['''^(violet-lantern-quarry-88|granite-meadow-lamp-42|qwertyuiop12|letmein123456)$''']
