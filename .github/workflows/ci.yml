name: CI

on:
  push:
    branches: [main]
  pull_request:
  create:
    tags:
      - "v*"
  # Lets docker-build (below) be run on demand from the Actions tab, without
  # making it part of every push — see that job's own comment.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector, not the plain postgres image — same reason as
        # docker-compose.yml: bundles the pgvector extension the
        # ai_embeddings table's migration needs (CREATE EXTENSION vector
        # fails against a plain postgres image).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: accuqual
          POSTGRES_PASSWORD: accuqual
          # Must contain "test" — test/setup.ts's testDataGuard.ts refuses to
          # run integration tests (which create/delete real tenants) against
          # any database whose name doesn't, precisely to stop this exact
          # class of accident (see that file's own comment on the 27-tenant
          # pollution incident this guard was added to prevent).
          POSTGRES_DB: accuqual_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accuqual"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check & run migrations (API)
        working-directory: services/api
        env:
          DATABASE_URL: postgres://accuqual:accuqual@localhost:5432/accuqual_test
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
        run: |
          npx tsc --noEmit
          npm run db:migrate

      - name: Test
        env:
          DATABASE_URL: postgres://accuqual:accuqual@localhost:5432/accuqual_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
        run: npm test

      - name: Build API
        run: npm run build --workspace services/api

      - name: Build Web
        run: npm run build --workspace apps/web

      - name: Build Workers
        run: |
          npm run build --workspace workers/workflow-worker
          npm run build --workspace workers/ai-worker
          npm run build --workspace workers/digital-twin-worker

  # Full-System Audit finding L7 — "Build Workers" above only ever ran
  # `tsc`, never validated that each worker's real Dockerfile (the thing
  # docker-compose.yml and any real deploy actually run) still builds. The
  # existing `docker-build` job below could have covered this, but it's
  # gated on Azure Container Registry secrets that don't exist and is
  # disabled outside workflow_dispatch — so worker Docker images had zero
  # CI coverage on a normal push/PR. This is a separate, always-on,
  # registry-free build-only job (no push, no credentials needed) so a
  # broken worker Dockerfile fails CI immediately. Does not touch the
  # existing docker-build job or any worker's application logic.
  build-worker-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: workflow-worker, dockerfile: workers/workflow-worker/Dockerfile }
          - { name: ai-worker, dockerfile: workers/ai-worker/Dockerfile }
          - { name: digital-twin-worker, dockerfile: workers/digital-twin-worker/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (validate only, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: accuqual-${{ matrix.service.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Disabled on every push/tag for now — there's no Azure Container
    # Registry configured (ACR_LOGIN_SERVER/ACR_USERNAME/ACR_PASSWORD don't
    # exist as repo secrets/vars), so this always failed with "Username and
    # password required." Deployment today is docker compose, not this.
    # Run it manually from the Actions tab (workflow_dispatch) once a real
    # registry + those 3 secrets/vars are set up, or restore
    # `github.ref == 'refs/heads/main'` here to re-enable it on every push.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        service:
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: workflow-worker, dockerfile: workers/workflow-worker/Dockerfile }
          - { name: ai-worker, dockerfile: workers/ai-worker/Dockerfile }
          - { name: digital-twin-worker, dockerfile: workers/digital-twin-worker/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/accuqual-${{ matrix.service.name }}:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/accuqual-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
