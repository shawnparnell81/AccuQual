name: Docker build

# Manual Azure Container Registry push. Not triggered by pull_request or
# push: ACR_LOGIN_SERVER / ACR_USERNAME / ACR_PASSWORD are not configured,
# and a skipped job named docker-build on pull requests blocks merge when
# that check is required. CI reports a successful no-op named docker-build
# instead. Run this workflow from the Actions tab after those three
# secrets/vars exist. Deployment today is docker compose, not this.
on:
  workflow_dispatch:

jobs:
  docker-build:
    name: docker-build (ACR push)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
          - { name: workflow-worker, dockerfile: workers/workflow-worker/Dockerfile }
          - { name: ai-worker, dockerfile: workers/ai-worker/Dockerfile }
          - { name: digital-twin-worker, dockerfile: workers/digital-twin-worker/Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/accuqual-${{ matrix.service.name }}:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/accuqual-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
