name: Security

# Runs on every PR and merge, and weekly — a new vulnerability in a dependency is published without anyone
# pushing code, so a schedule is what notices it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fails the build when a dependency that SHIPS (production deps of every workspace) has a high or critical
  # known vulnerability. Development-only tooling (test runner, dev server, migration generator) is reported
  # but does not block: it never runs in production, and its fixes are major-version upgrades that Dependabot
  # proposes and CI then tests.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Production dependencies (blocks on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Development dependencies (report only)
        run: |
          {
            echo "### Development-dependency advisories (not blocking)"
            echo
            echo '```'
            npm audit --audit-level=high 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # CodeQL is not a job here. This private repo does not have code scanning enabled
  # (the alerts API returns 403), so an analyze/upload step fails and a job that
  # always exits 0 would be a fake green check. The query config is kept at
  # .github/codeql/codeql-config.yml for the day code scanning is turned on.

  # Looks for credentials committed anywhere in the full history. GitHub's own secret scanning already covers
  # known provider token formats; this catches generic patterns (a password or key assigned in code) too.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Real Trivy scans are in image-scan.yml (push to main, weekly, manual). They are not
  # run on pull requests. When this matrix job lived here and was skipped,
  # GitHub reported the check name with the matrix expression still unexpanded.
  # A skipped required check blocks merge, so this job always reports that
  # exact historical name as success. The quoted brace expression is how
  # Actions emits those characters as text instead of evaluating them.
  image-scan-status:
    name: "Image scan (${{ '${{' }} matrix.image.name }})"
    runs-on: ubuntu-latest
    steps:
      - name: Image scan does not run on pull requests
        run: echo "Trivy image scan runs on push to main, weekly, and workflow_dispatch (image-scan.yml). Reporting the historical check name as success."
